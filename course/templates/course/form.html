{% extends "base.html" %}

{% block content %}
  <h1>{% if form.instance.pk %}Update Course{% else %}Create Course{% endif %}</h1>
  <form method="post" enctype="multipart/form-data">  <!-- Add enctype for file uploads -->
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
